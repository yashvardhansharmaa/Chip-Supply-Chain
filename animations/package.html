<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The Parts of an AI Chip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Instrument+Sans:wght@400;500;600&display=swap">
</head><body>
<script src="lib.js"></script>
<script>
const { PAL, clamp, ease, easeOut, mix, rng, label, text } = A, dark = A.theme === 'dark';
// Facts: a leading accelerator is two logic dies and eight HBM stacks on an interposer, a layer of much finer wiring, on a resin substrate
// (chapter 11); the substrate is the layered adapter between the chips and the circuit board (chapter 12); HBM holds the
// model's weights and the record of each conversation (the numbers the chip is working on) and sits a few millimeters from the processor (chapters 10 and 11); each logic die is
// about as large as one exposure can print (chapters 1 and 11); most AI accelerators are packaged by TSMC in
// Taiwan (chapter 11). Footprints follow those sizes; heights are exaggerated so each layer shows.
const STEPS = [
  { k: 'Package base', t0: 0.4, t1: 3.6, cap: 'An AI chip is built from several parts. First comes the package base, a layered board that connects everything to the circuit board below.' },
  { k: 'Interposer', t0: 3.6, t1: 6.8, cap: 'On it sits an interposer, a thin layer of very fine wiring that joins everything placed on top.' },
  { k: 'Logic chips', t0: 6.8, t1: 10.2, cap: 'Two logic chips go in the middle. They do the calculating, and each is as large as a chipmaking machine can print.' },
  { k: 'Memory', t0: 10.2, t1: 13.6, cap: 'Eight stacks of memory go beside them, a few millimeters away. They hold the AI model’s weights and the record of each conversation so far.' },
  { k: 'One package', t0: 13.6, t1: 17.4, cap: 'Together they make one AI accelerator. Most are put together by TSMC, in Taiwan.' },
];
const pr = (i, t) => clamp((t - STEPS[i].t0) / (STEPS[i].t1 - STEPS[i].t0));
const W = 760, H = 420, K = 3.0, OX = 226, OY = 232;
const iso = (x, y, z) => [OX + (x - y) * 0.866 * K, OY + (x + y) * 0.5 * K - z * K];
const C = {
  sub: dark ? ['#5f6f47', '#4a5838', '#3d4930'] : ['#6b7b4f', '#56643f', '#465234'], pad: dark ? '#9aa87b' : '#a3b187',
  inter: dark ? ['#b9c0c8', '#8e97a2', '#78818c'] : ['#dfe3e7', '#b5bcc4', '#9aa2ab'], wire: '#c07a40',
  die: dark ? ['#39424f', '#2a313b', '#222830'] : ['#2f3845', '#222932', '#1a2027'], tile: dark ? '#4a5667' : '#3c4859',
  hbm: dark ? ['#4a5360', '#363e49', '#2c333c'] : ['#434b57', '#323943', '#282e36'], hbmLine: dark ? '#6c7686' : '#5c6675',
};
// a box in the isometric view: top face and the two faces toward the viewer
function box(ctx, x, y, z, w, d, h, col, a) {
  if (a <= 0) return;
  const P = (px, py, pz) => iso(px, py, pz);
  ctx.save(); ctx.globalAlpha = a;
  const poly = (pts, fill) => { ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p))); ctx.closePath(); ctx.fill(); };
  poly([P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)], col[1]);   // front-left face
  poly([P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)], col[2]);   // front-right face
  poly([P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)], col[0]);   // top
  ctx.restore();
}
function topLine(ctx, x0, y0, x1, y1, z, col, lw, a) { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(...iso(x0, y0, z)); ctx.lineTo(...iso(x1, y1, z)); ctx.stroke(); ctx.restore(); }

// the parts, in millimeters
const SUB = { x: -40, y: -40, w: 80, d: 80, z: 0, h: 4 };
const IP = { x: -28.5, y: -32, w: 57, d: 64, z: 4, h: 1.6 };
const TOPZ = IP.z + IP.h, CH = 3.2;
const DIES = [{ x: -26, y: -16.25, w: 25.5, d: 32.5 }, { x: 0.5, y: -16.25, w: 25.5, d: 32.5 }];
const HBMS = []; [-30.3, 18.3].forEach((y) => [0, 1, 2, 3].forEach((i) => HBMS.push({ x: -23.6 + i * 11.8, y, w: 11, d: 12 })));
const drop = (q) => (1 - easeOut(q)) * 40;   // parts fall into place from above

function render(ctx, t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  const p = [0, 1, 2, 3, 4].map((i) => pr(i, t));
  // package base, with small parts around its edge
  const q0 = ease(p[0] / 0.5);
  box(ctx, SUB.x, SUB.y, SUB.z + drop(q0), SUB.w, SUB.d, SUB.h, C.sub, q0);
  if (q0 > 0.9) { ctx.save(); ctx.globalAlpha = (q0 - 0.9) * 10; ctx.fillStyle = C.pad; for (let i = 0; i < 16; i++) { const u = -36 + i * 4.8; for (const [px, py] of [[u, -37.5], [-37.5, u]]) { const [sx, sy] = iso(px, py, SUB.h); ctx.fillRect(sx - 1.6, sy - 1, 3.2, 2); } } ctx.restore(); }
  // interposer, with its wiring
  const q1 = ease(p[1] / 0.5);
  box(ctx, IP.x, IP.y, IP.z + drop(q1), IP.w, IP.d, IP.h, C.inter, q1);
  const wires = ease((p[1] - 0.5) / 0.4) * (1 - ease(p[2] / 0.4) * 0.6);
  if (wires > 0) for (let i = 0; i < 9; i++) { const yy = -12 + i * 3; topLine(ctx, -6, yy, 6, yy, TOPZ, C.wire, 1, wires); }
  // memory stacks: chips stacked, their layers showing on the sides; the back row is drawn before the chips
  const stack = (m, k) => {
    const q = ease((p[3] - k * 0.05) / 0.4); if (q <= 0) return;
    const z = TOPZ + drop(q);
    box(ctx, m.x, m.y, z, m.w, m.d, CH, C.hbm, q);
    ctx.save(); ctx.globalAlpha = q * 0.8; ctx.strokeStyle = C.hbmLine; ctx.lineWidth = 0.6;
    for (let l = 1; l < 8; l++) { const zz = z + l * CH / 8; ctx.beginPath(); ctx.moveTo(...iso(m.x, m.y + m.d, zz)); ctx.lineTo(...iso(m.x + m.w, m.y + m.d, zz)); ctx.lineTo(...iso(m.x + m.w, m.y, zz)); ctx.stroke(); }
    ctx.restore();
  };

  HBMS.forEach((m, k) => { if (k < 4) stack(m, k); });
  // logic chips: a floorplan of compute tiles on top, and the edge that links them
  DIES.forEach((d, k) => {
    const q = ease((p[2] - k * 0.18) / 0.45); if (q <= 0) return;
    const z = TOPZ + drop(q);
    box(ctx, d.x, d.y, z, d.w, d.d, CH, C.die, q);
    ctx.save(); ctx.globalAlpha = q;
    for (let i = 0; i < 5; i++) for (let j = 0; j < 7; j++) {
      const tx = d.x + 2 + i * 4.4, ty = d.y + 2.5 + j * 4.1, zz = z + CH;
      const pts = [iso(tx, ty, zz), iso(tx + 3.6, ty, zz), iso(tx + 3.6, ty + 3.3, zz), iso(tx, ty + 3.3, zz)];
      ctx.fillStyle = C.tile; ctx.beginPath(); pts.forEach((pt, n) => (n ? ctx.lineTo(...pt) : ctx.moveTo(...pt))); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    topLine(ctx, k ? d.x + 0.6 : d.x + d.w - 0.6, d.y + 3, k ? d.x + 0.6 : d.x + d.w - 0.6, d.y + d.d - 3, z + CH, C.wire, 2.2, q);
  });
  HBMS.forEach((m, k) => { if (k >= 4) stack(m, k); });
  // labels with leader lines, one per part, added as each lands
  const done = p[4] > 0 ? ease(p[4] / 0.3) : 0;
  const entry = (y, name, role, anchor, a, on) => {
    if (a <= 0) return;
    const [ax, ay] = iso(...anchor), lx = 470;
    ctx.save(); ctx.globalAlpha = a * 0.7 * (1 - done * 0.6); ctx.strokeStyle = on ? PAL.garnet : PAL.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx - 8, y - 5); ctx.lineTo(ax, ay); ctx.stroke();
    ctx.fillStyle = on ? PAL.garnet : PAL.ink2; ctx.beginPath(); ctx.arc(ax, ay, 2.4, 0, 7); ctx.fill(); ctx.restore();
    text(name, lx, y, '500 20px Fraunces', on ? PAL.garnet : PAL.ink, { alpha: a });
    text(role, lx, y + 20, '400 14.5px "Source Serif 4"', PAL.ink2, { alpha: a });
  };
  const cur = p[4] > 0 ? -1 : p[3] > 0 ? 3 : p[2] > 0 ? 2 : p[1] > 0 ? 1 : 0;
  entry(328, 'Package base', 'Connects the part to the circuit board', [SUB.x + SUB.w, 10, SUB.h / 2], ease((p[0] - 0.4) / 0.3), cur === 0);
  entry(248, 'Interposer', 'Fine wiring that joins what sits on top', [IP.x + IP.w, 22, TOPZ], ease((p[1] - 0.4) / 0.3), cur === 1);
  entry(168, 'Two logic chips', 'Do the calculating', [DIES[1].x + 16, DIES[1].y + 8, TOPZ + CH], ease((p[2] - 0.5) / 0.3), cur === 2);
  entry(88, 'Eight memory stacks', 'Hold model weights and working data', [HBMS[3].x + 8, HBMS[3].y + 4, TOPZ + CH], ease((p[3] - 0.4) / 0.3), cur === 3);
  if (done > 0) label('One AI accelerator', 470, 30, PAL.garnet, { alpha: done });
}
A.start({ W, H, duration: 18.6, fade: 0.8, steps: STEPS, render });
</script></body></html>
