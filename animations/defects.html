<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Big Chips and Defects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Instrument+Sans:wght@400;500;600&display=swap">
</head><body>
<script src="lib.js"></script>
<script>
const { PAL, clamp, ease, easeOut, mix, rng, label, text } = A, dark = A.theme === 'dark';
const STEPS = [
  { k: 'Specks land', t0: 0.5, t1: 3.2, cap: 'Specks of dust and tiny flaws land at random on every wafer. A textbook example assumes 0.8 per square centimeter.' },
  { k: 'Small chips', t0: 3.2, t1: 7.2, cap: 'Of chips 1 centimeter on a side, 49.2 percent miss every speck and come out flawless.' },
  { k: 'Big chips', t0: 7.2, t1: 11.2, cap: 'Chips 2 centimeters on a side are bigger targets for the same specks. Only 11.3 percent come out flawless.' },
  { k: 'The cost', t0: 11.2, t1: 15.2, cap: 'The big chip yields less and fits fewer times on a wafer, so it costs 20.1 times as much as the small one.' },
];
const pr = (i, t) => clamp((t - STEPS[i].t0) / (STEPS[i].t1 - STEPS[i].t0));

// ---- the simulation, in millimeters, built on the textbook example chapter 7 cites (Parhami, Dependable Computing,
// chapter 5, Example 5.2 and Fig. 5.5, PDF p. 8). Its wafer holds 120 dies of 1 x 1 cm or 26 dies of 2 x 2 cm; a wafer
// 70 mm in radius with the grids below holds exactly those counts. At 0.8 defects per square centimeter and a = 3,
// die yield = (1 + D0 x A / a)^-a gives 0.492 and 0.113, and the 2 x 2 die costs (120/26) x (0.492/0.113) = 20.1
// times as much. The three numbers on screen are the source's own, written as it gives them (SHOW). The wafer
// carries D0 x its area in specks, in loose clusters (groups of 1 to 8, about 9 mm across) that on average give the
// formula's yields, and the first random wafer that lands on them in whole chips (59 of 120, 3 of 26) is drawn.
const SHOW = ['49.2', '11.3', '20.1'];
const RAD = 70, D0 = 0.8, CL = 3;
const NSPECK = Math.round(D0 * Math.PI * (RAD / 10) ** 2);
const model = (area, d) => Math.pow(1 + d * area / CL, -CL);
function grid(s, ox, oy) {
  const out = [], n = Math.ceil(RAD / s) + 2;
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const x = ox + i * s, y = oy + j * s;
    if (Math.max(Math.hypot(x, y), Math.hypot(x + s, y), Math.hypot(x, y + s), Math.hypot(x + s, y + s)) <= RAD) out.push({ x, y, w: s, h: s });
  }
  return out;
}
const SMALL = grid(10, 0, 0), BIG = grid(20, -10, 0);   // each big die covers four small ones, as in Fig. 5.5
const hits = (dies, sp) => dies.map((d) => sp.some((s) => s.x >= d.x && s.x < d.x + d.w && s.y >= d.y && s.y < d.y + d.h));
const good = (dies, sp) => hits(dies, sp).filter((x) => !x).length;
const TARGET = [Math.round(model(1, D0) * SMALL.length), Math.round(model(4, D0) * BIG.length)];
function clustered(r) {
  const sp = [];
  while (sp.length < NSPECK) {
    let cx, cy; do { cx = (r() * 2 - 1) * RAD; cy = (r() * 2 - 1) * RAD; } while (Math.hypot(cx, cy) > RAD);
    const k = 1 + Math.floor(r() * 8);
    for (let j = 0; j < k && sp.length < NSPECK; j++) {
      const ang = r() * 6.283, rad = 9 * Math.sqrt(-2 * Math.log(1 - r() * 0.999));
      const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
      if (Math.hypot(x, y) < RAD) sp.push({ x, y, t: r() });
    }
  }
  return sp;
}
// no speck may sit on a die's edge, where it would seem to touch two chips: a speck within 1.25 mm of a 1 cm line moves
// out to 1.25 mm on its own side; the big grid's lines are 1 cm lines too, so no die in either grid changes its outcome
const EDGE = 1.25, off = (v) => { const g = Math.round(v / 10) * 10, e = v - g; return Math.abs(e) >= EDGE ? v : g + (e < 0 ? -EDGE : EDGE); };
const clearOfEdges = (sp) => { sp.forEach((s) => { const x = off(s.x), y = off(s.y); if (Math.hypot(x, y) < RAD - 0.5) { s.x = x; s.y = y; } }); return sp; };
const inBox = (s, d, m) => s.x >= d.x - m && s.x < d.x + d.w + m && s.y >= d.y - m && s.y < d.y + d.h + m;
const clear = (dies, sp) => dies.every((d) => (sp.some((s) => inBox(s, d, 0)) ? sp.some((s) => inBox(s, d, -1.2)) : !sp.some((s) => inBox(s, d, KEEP - 0.05))));
let SPECKS, SEED;
for (let seed = 1; seed < 40000; seed++) {   // a random wafer whose outcome sits on the formula's values
  const sp = clearOfEdges(clustered(rng(seed)));
  if (good(SMALL, sp) === TARGET[0] && good(BIG, sp) === TARGET[1]) { SPECKS = sp; SEED = seed; break; }
}
// a flawless die keeps a wider margin, so no speck seems to sit on it: a speck within 2.2 mm of one moves straight away
// from it to 2.2 mm, staying in the die it was in
const KEEP = 2.2;
function clearOfKeepers(sp, dies) {
  const hit = hits(dies, sp);
  dies.forEach((d, i) => {
    if (hit[i]) return;
    sp.forEach((s) => {
      if (!inBox(s, d, KEEP)) return;
      const ox = s.x < d.x ? d.x - s.x : s.x - (d.x + d.w), oy = s.y < d.y ? d.y - s.y : s.y - (d.y + d.h);   // how far outside it is on each axis
      const x = ox >= oy ? (s.x < d.x ? d.x - KEEP : d.x + d.w + KEEP) : s.x, y = ox >= oy ? s.y : (s.y < d.y ? d.y - KEEP : d.y + d.h + KEEP);
      if (Math.hypot(x, y) < RAD - 0.5) { s.x = x; s.y = y; }
    });
  });
  return sp;
}
clearOfKeepers(clearOfKeepers(SPECKS, SMALL), BIG);
const HS = hits(SMALL, SPECKS), HB = hits(BIG, SPECKS);

// ---- drawing
const W = 760, H = 420, CX = 212, CY = 210, K = 196 / RAD, px = (x) => CX + x * K, py = (y) => CY + y * K;
function wafer() {
  const g = ctx0().createLinearGradient(px(-RAD), py(-RAD), px(RAD), py(RAD));
  const s = dark ? ['#8d959f', '#737c87', '#a2a9b2', '#666f7a'] : ['#d9dde2', '#c2c8cf', '#e4e7eb', '#b3bac2'];
  g.addColorStop(0, s[0]); g.addColorStop(0.45, s[1]); g.addColorStop(0.55, s[2]); g.addColorStop(1, s[3]);
  const c = ctx0(); c.fillStyle = g; c.beginPath(); c.arc(CX, CY, RAD * K, 0, 7); c.fill();

  c.strokeStyle = dark ? 'rgba(236,233,226,0.35)' : 'rgba(20,24,31,0.5)'; c.lineWidth = 1; c.beginPath(); c.arc(CX, CY, RAD * K, 0, 7); c.stroke();
}
const ctx0 = () => A.ctx;
function dies(list, deadAt, drawP, fillP, alpha) {
  if (alpha <= 0) return;
  const c = ctx0(); c.save(); c.globalAlpha = alpha;
  list.forEach((d, i) => {
    const order = (d.y + RAD) / (2 * RAD), a = clamp((drawP - order * 0.7) / 0.3); if (a <= 0) return;
    const f = clamp((fillP - order * 0.6) / 0.4), dead = deadAt(i);
    if (f > 0) { c.fillStyle = dead ? `rgba(122,31,43,${(dark ? 0.8 : 0.62) * f * a})` : `rgba(255,255,255,${(dark ? 0.2 : 0.32) * f * a})`; c.fillRect(px(d.x), py(d.y), d.w * K, d.h * K); }
    c.strokeStyle = dark ? `rgba(20,23,28,${0.55 * a})` : `rgba(20,24,31,${0.4 * a})`; c.lineWidth = 0.8; c.strokeRect(px(d.x) + 0.4, py(d.y) + 0.4, d.w * K - 0.8, d.h * K - 0.8);
  });
  c.restore();
}
function row(y, value, unit, name, state, a) {
  if (a <= 0) return;
  const c = ctx0(), col = state ? PAL.garnet : PAL.ink2;
  if (state) { c.globalAlpha = a; c.fillStyle = PAL.garnet; c.fillRect(452, y - 38, 2, 58); c.globalAlpha = 1; }
  text(String(value), 470, y, '300 46px Fraunces', col, { alpha: a });
  c.font = '300 46px Fraunces'; const vw = c.measureText(String(value)).width;
  text(unit, 470 + vw + 8, y, '500 13px "Instrument Sans"', col, { alpha: a });
  label(name, 470, y + 20, PAL.muted, { alpha: a });
}
// the cost step: the few big dies that came out flawless are the ones that pay for the wafer
function keepers(p) {
  if (p <= 0) return;
  const c = ctx0(); let n = 0;
  BIG.forEach((d, i) => {
    if (HB[i]) return;
    const a = ease((p - n++ * 0.12) / 0.35); if (a <= 0) return;
    c.save(); c.globalAlpha = a;
    c.fillStyle = dark ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.6)'; c.fillRect(px(d.x), py(d.y), d.w * K, d.h * K);
    c.strokeStyle = PAL.ink; c.lineWidth = 2; c.strokeRect(px(d.x) + 1, py(d.y) + 1, d.w * K - 2, d.h * K - 2);
    c.restore();
  });
}

function render(ctx, t) {
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = easeOut(clamp(t / 0.5)); wafer(); ctx.globalAlpha = 1;
  const pS = pr(1, t), pB = pr(2, t), pC = pr(3, t), swap = clamp((t - STEPS[2].t0) / 0.6);
  dies(SMALL, (i) => HS[i], ease(pS * 1.6), ease((pS - 0.4) / 0.5), 1 - ease(swap));
  dies(BIG, (i) => HB[i], ease(pB * 1.6), ease((pB - 0.4) / 0.5), ease(swap));
  keepers(pC * 2);
  SPECKS.forEach((s) => {
    const a = clamp((pr(0, t) - s.t * 0.8) / 0.2); if (a <= 0) return;
    const r = mix(8, 2.7, easeOut(a));
    ctx.fillStyle = dark ? `rgba(20,23,28,${a})` : `rgba(20,24,31,${0.92 * a})`; ctx.beginPath(); ctx.arc(px(s.x), py(s.y), r, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(247,246,242,${0.9 * a})`; ctx.lineWidth = 1; ctx.stroke();
  });
  const cur = pC > 0.2 ? 2 : pB > 0 ? 1 : pS > 0 ? 0 : -1;
  row(110, SHOW[0], 'percent flawless', 'Small chips, 1 × 1 cm', cur === 0, ease((pS - 0.55) / 0.3));
  row(215, SHOW[1], 'percent flawless', 'Big chips, 2 × 2 cm', cur === 1, ease((pB - 0.55) / 0.3));
  row(320, SHOW[2], 'times the cost', 'Big chip against small', cur === 2, ease((pC - 0.2) / 0.3));
}
A.start({ W, H, duration: 16.4, fade: 0.8, steps: STEPS, render });
// self-check: the formula and the die counts give back the source's three numbers, and the drawn wafer hits the targets
window.INFO = { NSPECK, SEED, small: SMALL.length, big: BIG.length, good: [good(SMALL, SPECKS), good(BIG, SPECKS)], TARGET, SHOW, clear: [clear(SMALL, SPECKS), clear(BIG, SPECKS)],
  check: [(100 * model(1, D0)).toFixed(1), (100 * model(4, D0)).toFixed(1), (SMALL.length / BIG.length * (0.492 / 0.113)).toFixed(1)] };
</script></body></html>
