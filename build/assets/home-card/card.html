<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..600,0,0&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Instrument+Sans:wght@500;600&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#f7f6f2;-webkit-font-smoothing:antialiased}
.art{position:absolute;left:50px;top:-10px;width:1100px;height:760px;background:url(art-light.png) 0 0/1100px 760px no-repeat;opacity:0.55}
.scrim{position:absolute;left:300px;top:40px;width:600px;height:540px;background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(247,246,242,0.94) 0%, rgba(247,246,242,0.94) 55%, rgba(0,0,0,0) 100%)}
.box{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wm{font-family:Fraunces,serif;font-weight:500;font-size:28px;letter-spacing:.075em;font-variant-caps:small-caps;font-variation-settings:"opsz" 36;color:#3b424c;margin:0 0 26px}
h1{font-family:Fraunces,serif;font-weight:400;font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 0;font-size:112px;line-height:.98;letter-spacing:-.015em;color:#14181f;margin:0}
.sub{font-family:"Source Serif 4",serif;font-style:italic;font-size:25px;color:#3b424c;margin:24px 0 0}
.rule{width:56px;height:2px;background:#7a1f2b;margin:30px 0 26px}
.url{font-family:"Instrument Sans",sans-serif;font-weight:500;font-size:34px;letter-spacing:.01em;color:#7a1f2b;margin:0}
</style></head><body><div class="card"><div class="art"></div><div class="scrim"></div>
<div class="box"><p class="wm">Chip Supply Chain</p><h1>How AI chips<br>are made</h1><div class="rule"></div><p class="url">chipsupplychain.org</p></div></div></body></html>
